name: iOS build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 .github/scripts/pick_simulator.py)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          set +e
          xcodebuild build-for-testing \
            -project FishLogger.xcodeproj \
            -scheme FishLogger \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1
          STATUS=$?
          grep -E "(error|warning):" build.log | sort -u | head -300
          if [ $STATUS -ne 0 ]; then tail -60 build.log; fi
          exit $STATUS

      - name: Test
        run: |
          set +e
          xcodebuild test-without-building \
            -project FishLogger.xcodeproj \
            -scheme FishLogger \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO > test.log 2>&1
          STATUS=$?
          grep -E "✘|failed|error:|recorded an issue|Executed|passed after|Test run with" test.log | tail -200
          if [ $STATUS -ne 0 ]; then tail -80 test.log; fi
          exit $STATUS
